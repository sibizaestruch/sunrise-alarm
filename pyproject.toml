[project]
name = "ha-sunrise-alarm"
version = "0.1.0"
description = "Home Assistant sunrise alarm integration"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
